steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/ans-dashboard:$SHORT_SHA
      - --build-arg
      - VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg
      - VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg
      - VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - --build-arg
      - VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}
      - --build-arg
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - VITE_FIREBASE_MEASUREMENT_ID=${_VITE_FIREBASE_MEASUREMENT_ID}
      - --build-arg
      - VITE_DATASET_VIEW=${_VITE_DATASET_VIEW}
      - --build-arg
      - VITE_MART_ANS_TABLE=${_VITE_MART_ANS_TABLE}
      - --build-arg
      - VITE_MART_UNIODONTO_TABLE=${_VITE_MART_UNIODONTO_TABLE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/ans-dashboard:$SHORT_SHA

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        cat > /workspace/cloudrun-env.yaml <<'ENVVARS'
        NODE_ENV: "production"
        SERVE_STATIC: "true"
        BQ_PROJECT_ID: "${_BQ_PROJECT_ID}"
        BQ_DATASET: "${_BQ_DATASET}"
        BQ_AUX_DATASET: "${_BQ_AUX_DATASET}"
        BQ_EXPORT_VIEW: "${_BQ_EXPORT_VIEW}"
        BQ_LOCATION: "${_BQ_LOCATION}"
        BQ_MART_DATASET: "${_BQ_MART_DATASET}"
        BQ_MART_ANS_TABLE: "${_BQ_MART_ANS_TABLE}"
        BQ_MART_UNIODONTO_TABLE: "${_BQ_MART_UNIODONTO_TABLE}"
        BQ_ALLOWED_VIEWS: "${_BQ_ALLOWED_VIEWS}"
        BQ_PRESTADORES_TABLE: "${_BQ_PRESTADORES_TABLE}"
        BQ_UHUB_COOPERATIVAS_CATALOG_TABLE: "${_BQ_UHUB_COOPERATIVAS_CATALOG_TABLE}"
        QUERY_CACHE_TTL_MS: "${_QUERY_CACHE_TTL_MS}"
        BQ_MAX_BYTES_BILLED: "${_BQ_MAX_BYTES_BILLED}"
        BQ_EXECUTE: "${_BQ_EXECUTE}"
        FIREBASE_PROJECT_ID: "${_FIREBASE_PROJECT_ID}"
        UHUB_API_BASE_URL: "${_UHUB_API_BASE_URL}"
        ENVVARS

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - gcr.io/$PROJECT_ID/ans-dashboard:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --service-account
      - ${_RUN_SERVICE_ACCOUNT}
      - --cpu
      - '1'
      - --memory
      - '1Gi'
      - --concurrency
      - '1'
      - --max-instances
      - '3'
      - --timeout
      - '300s'
      - --env-vars-file
      - /workspace/cloudrun-env.yaml
      - --set-secrets
      - UHUB_TOKEN=${_UHUB_TOKEN_SECRET}:latest

images:
  - gcr.io/$PROJECT_ID/ans-dashboard:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

