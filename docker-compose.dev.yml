services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev:local
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: "http://localhost:4000"
    ports:
      - "5173:5173"
      - "4000:4000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./.cert:/app/.cert:ro

volumes:
  node_modules:
